                  container.addView(btnRescan)
                  scrollView.addView(container)
                  setContentView(scrollView)

                  requestSmsPermissions()
                  requestIgnoreBatteryOptimizations()
              }

              private fun requestSmsPermissions() {
                  val needed = mutableListOf(
                      Manifest.permission.RECEIVE_SMS,
                      Manifest.permission.READ_SMS
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      needed.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  val missing = needed.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 101)
                  } else {
                      startListenerService()
                  }
              }

              private fun startListenerService() {
                  val serviceIntent = Intent(this, SmsForegroundService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent)
                  } else {
                      startService(serviceIntent)
                  }
                  statusTextView.text = "✅ ACTIVE: Listening 24/7 for CBE (1********6367) & Telebirr (127) SMS -> Syncing Two-Way with Firebase (lihketdigitalpayment)."
              }

              private fun requestIgnoreBatteryOptimizations() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:$packageName")
                          }
                          startActivity(intent)
                      }
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101 && grantResults.isNotEmpty() && grantResults.all { it == PackageManager.PERMISSION_GRANTED }) {
                      startListenerService()
                  }
              }
          }
