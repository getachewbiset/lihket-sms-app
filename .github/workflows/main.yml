      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Gradle 8.7 (Cache Disabled to Prevent Runner Warnings)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: 5. Generate Signed Keystore for Lihket Digital Academy
        working-directory: app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'lihketdigitalacademy@251et' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lihketdigitalacademy.et' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lihketdigitalacademy@251et' }}
        run: |
          rm -f lihket-release-key.jks
          keytool -genkeypair -v \
            -keystore lihket-release-key.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Getachew Biset, OU=Lihket Digital Academy, O=Lihket, L=Addis Ababa, ST=Addis Ababa, C=ET"

      - name: 6. Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'lihketdigitalacademy@251et' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lihketdigitalacademy.et' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lihketdigitalacademy@251et' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: 7. Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lihket-SMS-Listener-Signed-APK
          path: app/build/outputs/apk/release/*.apk
