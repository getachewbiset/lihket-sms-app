          cat << 'EOF_PARSER' > app/src/main/java/lihket_digital_academy/et/SmsParser.kt
          package lihket_digital_academy.et

          import java.util.Locale

          data class ParsedPaymentSms(
              val isValid: Boolean,
              val provider: String,          // "CBE" or "Telebirr"
              val senderAddress: String,     // "CBE" or "127"
              val transactionId: String,     // e.g. "FT26309ABC12" or "DB62J9H7KL"
              val amount: Double,            // e.g. 1500.00
              val senderPhone: String,       // e.g. "0911223344" (for Telebirr)
              val receiptLink: String,       // e.g. "https://mbreciept.cbe.com.et/..."
              val rawMessage: String
          )

          object SmsParser {

              // Merchant Constants for Getachew Biset (Lihket Digital Academy)
              private const val EXPECTED_CBE_SUFFIX = "6367" // Matches 1********6367 / 1000212746367

              /**
               * Checks if the SMS comes from Commercial Bank of Ethiopia (CBE) or Telebirr (127).
               */
              fun isTrustedPaymentSender(sender: String, body: String): Boolean {
                  val normSender = sender.trim().uppercase(Locale.ROOT)
                  val normBody = body.trim()
                  val isCbe = normSender.contains("CBE") ||
                          normBody.contains("mbreciept.cbe.com.et", ignoreCase = true) ||
                          normBody.contains("1********6367")
                  val isTelebirr = normSender == "127" ||
                          normSender.contains("TELEBIRR") ||
                          normBody.contains("telebirr", ignoreCase = true) ||
                          normBody.contains("ቴሌብር")
                  return isCbe || isTelebirr
              }

              /**
               * Parses both English and Amharic SMS messages from CBE and Telebirr (127).
               */
              fun parse(sender: String, body: String): ParsedPaymentSms {
                  val normSender = sender.trim()
                  val normBody = body.trim()

                  val isCbe = normSender.uppercase(Locale.ROOT).contains("CBE") ||
                          normBody.contains("mbreciept.cbe.com.et", ignoreCase = true) ||
                          normBody.contains("1********6367")

                  val provider = if (isCbe) "CBE" else "Telebirr"

                  // 1. Extract Amount (Supports "ETB 1,500.00", "ብር 500.00 ተቀብለዋል", "500.00 ETB")
                  val amountRegexes = listOf(
                      Regex("""(?:ETB|ብር|Birr)\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?|[0-9]+(?:\.[0-9]{1,2})?)""", RegexOption.IGNORE_CASE),
                      Regex("""([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?|[0-9]+(?:\.[0-9]{1,2})?)\s*(?:ETB|ብር|Birr)""", RegexOption.IGNORE_CASE)
                  )
                  var extractedAmount = 0.0
                  for (regex in amountRegexes) {
                      val match = regex.find(normBody)
                      if (match != null) {
                          val cleanNum = match.groupValues[1].replace(",", "")
                          extractedAmount = cleanNum.toDoubleOrNull() ?: 0.0
                          if (extractedAmount > 0.0) break
                      }
                  }

                  // 2. Extract Transaction ID / Reference Number
                  var extractedTxId = ""
                  if (provider == "CBE") {
                      val cbeTxRegexes = listOf(
                          Regex("""mbreciept\.cbe\.com\.et/\?id=([A-Z0-9]{8,20})""", RegexOption.IGNORE_CASE),
                          Regex("""mbreciept\.cbe\.com\.et/([A-Z0-9]{8,20})""", RegexOption.IGNORE_CASE),
                          Regex("""apps\.cbe\.com\.et:100/\?id=([A-Z0-9]{8,20})""", RegexOption.IGNORE_CASE),
                          Regex("""\b(FT[0-9A-Z]{8,16})\b""", RegexOption.IGNORE_CASE),
                          Regex("""(?:Ref(?:\s*No)?|Transaction\s*ID|መለያ\s*ቁጥር)[:\s#]*([A-Z0-9]{8,20})""", RegexOption.IGNORE_CASE)
                      )
                      for (r in cbeTxRegexes) {
                          val m = r.find(normBody)
                          if (m != null) {
                              extractedTxId = m.groupValues[1].uppercase(Locale.ROOT).take(12)
                              break
                          }
                      }
                  } else {
                      val telebirrTxRegexes = listOf(
                          Regex("""(?:transaction\s*(?:number|no|id)|የትራንዛክሽን\s*(?:ቁጥር|መለያ)|ቁጥር)\s*(?:is|ነው)?[:\s]*([A-Z0-9]{8,15})""", RegexOption.IGNORE_CASE),
                          Regex("""\b([A-Z]{2}[0-9A-Z]{8,12})\b""")
                      )
                      for (r in telebirrTxRegexes) {
                          val m = r.find(normBody)
                          if (m != null) {
                              extractedTxId = m.groupValues[1].uppercase(Locale.ROOT)
                              break
                          }
                      }
                  }

                  // 3. Extract Sender Phone Number (for Telebirr pairing)
                  val phoneRegex = Regex("""(?:\+?251|0)?(9[0-9]{8}|7[0-9]{8}|[0-9]{2}\*+[0-9]{2,4})""")
                  val extractedPhone = phoneRegex.find(normBody)?.value ?: if (provider == "CBE") "CBE_TRANSFER" else "UNKNOWN"

                  // 4. Verify CBE Account ends with 6367 (1********6367)
                  val accountMatches = if (provider == "CBE") {
                      normBody.contains(EXPECTED_CBE_SUFFIX)
                  } else {
                      true
                  }

                  // 5. Extract Official Receipt Link
                  val urlRegex = Regex("""https?://[^\s]+""", RegexOption.IGNORE_CASE)
                  val receiptUrl = urlRegex.find(normBody)?.value
                      ?: if (provider == "CBE" && extractedTxId.isNotEmpty()) "https://mbreciept.cbe.com.et/$extractedTxId" else ""

                  val isValid = extractedAmount > 0.0 && extractedTxId.isNotEmpty() && accountMatches

                  return ParsedPaymentSms(
                      isValid = isValid,
                      provider = provider,
                      senderAddress = normSender,
                      transactionId = extractedTxId,
                      amount = extractedAmount,
                      senderPhone = extractedPhone,
                      receiptLink = receiptUrl,
                      rawMessage = normBody
                  )
              }
          }
          EOF_PARSER

          cat << 'EOF_SYNC' > app/src/main/java/lihket_digital_academy/et/FirebaseSyncManager.kt
          package lihket_digital_academy.et

          import android.content.Context
          import android.database.Cursor
          import android.net.Uri
          import android.util.Log
          import com.google.firebase.Timestamp
          import com.google.firebase.firestore.FieldValue
          import com.google.firebase.firestore.FirebaseFirestore
          import java.util.Locale

          object FirebaseSyncManager {

              private const val TAG = "LihketFirebaseSync"

              /**
               * Pushes a parsed CBE or Telebirr SMS to Firestore and immediately runs 100% Order Pairing.
               */
              fun pushSmsAndVerifyOrder(parsed: ParsedPaymentSms) {
                  if (!parsed.isValid) return

                  val db = FirebaseFirestore.getInstance()
                  val txIdUpper = parsed.transactionId.uppercase(Locale.ROOT)

                  val smsDocData = hashMapOf(
                      "provider" to parsed.provider,
                      "sender" to parsed.senderAddress,
                      "transactionId" to txIdUpper,
                      "amount" to parsed.amount,
                      "senderPhone" to parsed.senderPhone,
                      "receiptLink" to parsed.receiptLink,
                      "rawBody" to parsed.rawMessage,
                      "consumed" to false,
                      "timestamp" to FieldValue.serverTimestamp()
                  )

                  // Use transactionId as document key to prevent duplicate SMS writes
                  db.collection("incoming_sms").document(txIdUpper)
                      .set(smsDocData)
                      .addOnSuccessListener {
                          Log.d(TAG, "SMS saved to Firebase: $txIdUpper (${parsed.amount} ETB)")
                          pairWithPendingOrder(db, parsed)
                      }
                      .addOnFailureListener { e ->
                          Log.e(TAG, "Error pushing SMS to Firebase", e)
                      }
              }

              /**
               * Pairs the incoming SMS with any matching order in `pending_orders` (100% Verification).
               */
              private fun pairWithPendingOrder(db: FirebaseFirestore, sms: ParsedPaymentSms) {
                  val txIdUpper = sms.transactionId.uppercase(Locale.ROOT)

                  db.collection("pending_orders")
                      .whereEqualTo("transactionId", txIdUpper)
                      .get()
                      .addOnSuccessListener { snapshot ->
                          for (doc in snapshot.documents) {
                              val currentStatus = doc.getString("status") ?: "WAITING_FOR_SMS"
                              if (currentStatus == "VERIFIED") continue

                              val expectedAmount = doc.getDouble("amount") ?: 0.0
                              val orderMethod = doc.getString("method") ?: ""
                              val studentPhone = doc.getString("studentPhone") ?: ""

                              // 1. Check Method Match
                              if (!orderMethod.equals(sms.provider, ignoreCase = true)) {
                                  doc.reference.update(
                                      mapOf(
                                          "status" to "ERROR_METHOD_MISMATCH",
                                          "statusReason" to "Payment method mismatch: expected $orderMethod, got ${sms.provider}"
                                      )
                                  )
                                  continue
                              }

                              // 2. Check Exact Amount (100% Match Required)
                              if (sms.amount < expectedAmount) {
                                  val reason = "የገንዘብ መጠን አልተዛመደም! የተጠየቀው፡ $expectedAmount ብር፣ የገባው፡ ${sms.amount} ብር"
                                  doc.reference.update(
                                      mapOf(
                                          "status" to "ERROR_AMOUNT_MISMATCH",
                                          "statusReason" to reason
                                      )
                                  )
                                  logSecurityAlert(db, "AMOUNT_MISMATCH", reason, txIdUpper)
                                  continue
                              }

                              // 3. Check Telebirr Phone Match
                              if (sms.provider == "Telebirr" && !phonesMatch(studentPhone, sms.senderPhone)) {
                                  val reason = "የቴሌብር ስልክ ቁጥር አልተዛመደም! የተመዘገበው፡ $studentPhone፣ የላከው፡ ${sms.senderPhone}"
                                  doc.reference.update(
                                      mapOf(
                                          "status" to "ERROR_PHONE_MISMATCH",
                                          "statusReason" to reason
                                      )
                                  )
                                  logSecurityAlert(db, "PHONE_MISMATCH", reason, txIdUpper)
                                  continue
                              }

                              // 4. All Checks 100% Passed -> Auto-Unlock Course 24/7!
                              doc.reference.update(
                                  mapOf(
                                      "status" to "VERIFIED",
                                      "statusReason" to "✅ 100% ተረጋግጧል (${sms.provider} • ${sms.amount} ETB • TxID: $txIdUpper)",
                                      "verifiedAt" to FieldValue.serverTimestamp()
                                  )
                              )
                              db.collection("incoming_sms").document(txIdUpper).update(
                                  mapOf(
                                      "consumed" to true,
                                      "consumedByOrderId" to doc.id
                                  )
                              )
                          }
                      }
              }

              private fun phonesMatch(orderPhone: String, smsPhone: String): Boolean {
                  if (smsPhone == "UNKNOWN" || smsPhone.isBlank()) return true
                  val cleanOrder = orderPhone.filter { it.isDigit() }.takeLast(9)
                  if (smsPhone.contains("*")) {
                      val tail = smsPhone.filter { it.isDigit() }.takeLast(2)
                      return cleanOrder.endsWith(tail)
                  }
                  val cleanSms = smsPhone.filter { it.isDigit() }.takeLast(9)
                  return cleanOrder == cleanSms
              }

              private fun logSecurityAlert(db: FirebaseFirestore, type: String, detail: String, txId: String) {
                  db.collection("security_alerts").add(
                      mapOf(
                          "type" to type,
                          "title" to "Security / Verification Alert ($type)",
                          "detail" to "$detail (TxID: $txId)",
                          "timestamp" to Timestamp.now()
                      )
                  )
              }

              /**
               * Two-Way Sync: Listens to `listener_commands/latest_command` from Firebase so Web Admin
               * or Pending Orders can trigger an immediate inbox scan or heartbeat check on the tablet.
               */
              fun startTwoWayCommandListener(context: Context) {
                  val db = FirebaseFirestore.getInstance()

                  // Update device heartbeat
                  db.collection("device_status").document("tablet_main").set(
                      mapOf(
                          "owner" to "Getachew Biset",
                          "package" to "lihket_digital_academy.et",
                          "status" to "ONLINE_LISTENING_24_7",
                          "lastHeartbeat" to FieldValue.serverTimestamp()
                      )
                  )

                  db.collection("listener_commands").document("latest_command")
                      .addSnapshotListener { snapshot, error ->
                          if (error != null || snapshot == null || !snapshot.exists()) return@addSnapshotListener
                          val cmd = snapshot.getString("command") ?: return@addSnapshotListener
                          when (cmd) {
                              "RESCAN_LAST_10_SMS", "WATCH_TRANSACTION" -> {
                                  scanRecentInboxSms(context, 15)
                              }
                              "PING_HEARTBEAT" -> {
                                  db.collection("device_status").document("tablet_main").update(
                                      "lastHeartbeat", FieldValue.serverTimestamp()
                                  )
                              }
                          }
                      }
              }

              /**
               * Reads recent SMS from the Android Inbox (used when triggered by Two-Way Firebase sync
               * in case network was briefly offline when SMS arrived).
               */
              fun scanRecentInboxSms(context: Context, limit: Int = 15) {
                  try {
                      val cursor: Cursor? = context.contentResolver.query(
                          Uri.parse("content://sms/inbox"),
                          arrayOf("address", "body", "date"),
                          null,
                          null,
                          "date DESC LIMIT $limit"
                      )
                      cursor?.use {
                          val addrIdx = it.getColumnIndex("address")
                          val bodyIdx = it.getColumnIndex("body")
                          while (it.moveToNext()) {
                              val sender = if (addrIdx >= 0) it.getString(addrIdx) ?: "" else ""
                              val body = if (bodyIdx >= 0) it.getString(bodyIdx) ?: "" else ""
                              if (SmsParser.isTrustedPaymentSender(sender, body)) {
                                  val parsed = SmsParser.parse(sender, body)
                                  if (parsed.isValid) {
                                      pushSmsAndVerifyOrder(parsed)
                                  }
                              }
                          }
                      }
                  } catch (e: SecurityException) {
                      Log.e(TAG, "READ_SMS permission not granted yet", e)
                  }
              }
          }
          EOF_SYNC

          cat << 'EOF_RECEIVER' > app/src/main/java/lihket_digital_academy/et/SmsBroadcastReceiver.kt
          package lihket_digital_academy.et

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.provider.Telephony
          import android.util.Log

          class SmsBroadcastReceiver : BroadcastReceiver() {

              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      val serviceIntent = Intent(context, SmsForegroundService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(serviceIntent)
                      } else {
                          context.startService(serviceIntent)
                      }
                      return
                  }

                  if (intent.action == Telephony.Sms.Intents.SMS_RECEIVED_ACTION) {
                      val messages = Telephony.Sms.Intents.getMessagesFromIntent(intent)
                      if (messages.isNullOrEmpty()) return

                      val sender = messages[0].originatingAddress ?: ""
                      val fullBody = StringBuilder()
                      for (msg in messages) {
                          fullBody.append(msg.messageBody ?: "")
                      }
                      val bodyStr = fullBody.toString()

                      Log.d("LihketSmsReceiver", "Incoming SMS from: $sender")

                      // Local Filtering: Only process CBE and Telebirr (127) messages
                      if (SmsParser.isTrustedPaymentSender(sender, bodyStr)) {
                          val parsed = SmsParser.parse(sender, bodyStr)
                          if (parsed.isValid) {
                              FirebaseSyncManager.pushSmsAndVerifyOrder(parsed)
                          }
                      }
                  }
              }
          }
          EOF_RECEIVER

          cat << 'EOF_SERVICE' > app/src/main/java/lihket_digital_academy/et/SmsForegroundService.kt
          package lihket_digital_academy.et

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat

          class SmsForegroundService : Service() {

              companion object {
                  private const val CHANNEL_ID = "lihket_sms_listener_channel"
                  private const val NOTIFICATION_ID = 25101
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  val notification: Notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Lihket Digital Academy SMS Listener")
                      .setContentText("24/7 CBE & Telebirr Auto-Verification Active (Firebase Connected)")
                      .setSmallIcon(android.R.drawable.sym_action_email)
                      .setOngoing(true)
                      .build()

                  startForeground(NOTIFICATION_ID, notification)

                  // Start Two-Way Firebase Command Listener
                  FirebaseSyncManager.startTwoWayCommandListener(applicationContext)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  return START_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Lihket 24/7 Payment Listener",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }
          }
          EOF_SERVICE

